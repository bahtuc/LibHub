spring.application.name=libhub
# IntelliJ may launch from either LibHub/backend or the parent LibHub folder.
# Load the same local secrets file correctly in both cases.
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
server.port=8080
# Vite may use 5173, a fallback port such as 5174, or preview on 4173.
# Keep credentialed CORS local by default; production should override this
# with the exact deployed frontend origin(s).
library.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
library.upload.root=${LIBRARY_UPLOAD_ROOT:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Gmail SMTP for the second sign-in step. Keep credentials in environment/.env only.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:tungttts01665@gmail.com}
spring.mail.password=${MAIL_APP_PASSWORD:suee vwfd lisg ynln}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
library.auth.otp.enabled=${MAIL_OTP_ENABLED:true}
library.auth.otp.ttl-seconds=300
library.auth.otp.max-attempts=5
library.auth.otp.resend-cooldown-seconds=60
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=LibHub;encrypt=true;trustServerCertificate=true;
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
# Database schema is managed manually by SQLlibhub1.sql.
spring.flyway.enabled=false
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
# VNPay sandbox. Set the merchant credentials in the environment; do not
# commit them to source control.
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/return}
vnpay.frontend-result-url=${VNPAY_FRONTEND_RESULT_URL:http://localhost:5173/payment/result}
