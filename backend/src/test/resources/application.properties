spring.datasource.url=jdbc:h2:mem:libhubtest;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.flyway.enabled=false
vnpay.tmn-code=test-code
vnpay.hash-secret=test-secret
vnpay.pay-url=https://sandbox.example.test/pay
vnpay.return-url=http://localhost/api/payments/vnpay/return
vnpay.frontend-result-url=http://localhost/payment/result
spring.mail.host=localhost
library.auth.otp.enabled=false
